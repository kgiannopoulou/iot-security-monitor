# $SPLUNK_HOME/etc/apps/iotmon/local/props.conf

[iotmon:alert:json]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
TZ = UTC
# CIM Intrusion Detection field names
FIELDALIAS-iotmon_cim = source_ip AS src destination_ip AS dest rule AS signature_id rule_name AS signature
EVAL-severity = lower(severity)
EVAL-vendor_product = "iotmon"

[iotmon:alert:cef]
SHOULD_LINEMERGE = false
# The CEF extension is key=value: rt, src, dst, dpt, msg, cs1 (mitre), cfp1 (confidence)
EXTRACT-cef_header = CEF:0\|(?<vendor>[^|]*)\|(?<product>[^|]*)\|(?<version>[^|]*)\|(?<signature_id>[^|]*)\|(?<signature>[^|]*)\|(?<cef_severity>\d+)\|
KV_MODE = auto

# Example search:
#   index=security sourcetype=iotmon:alert:json confidence_level=high
#   | stats count by signature_id, src, dest | sort -count
