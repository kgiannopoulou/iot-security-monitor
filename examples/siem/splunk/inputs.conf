# Splunk Universal Forwarder on the monitoring host: tail iotmon's alerts.
# $SPLUNK_HOME/etc/apps/iotmon/local/inputs.conf

[monitor:///opt/iotmon/data/alerts.jsonl]
sourcetype = iotmon:alert:json
index = security
disabled = false

# Alternatively, receive CEF over syslog from `iotmon live --syslog splunk:5514`
# [udp://5514]
# sourcetype = iotmon:alert:cef
# index = security
