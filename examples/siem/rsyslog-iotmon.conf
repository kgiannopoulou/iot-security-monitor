# rsyslog collector: receive iotmon's syslog alerts and file them separately
# (then forward to the SIEM of your choice). /etc/rsyslog.d/30-iotmon.conf
#
#   iotmon live -i eth0 -q --syslog collector.example:514 --syslog-format cef
#
# iotmon sends RFC 5424 messages, facility local4, APP-NAME "iotmon",
# MSGID = the rule ID, body = CEF (or ECS JSON with --syslog-format json).

module(load="imudp")
input(type="imudp" port="514")

template(name="IotmonFile" type="string" string="%TIMESTAMP:::date-rfc3339% %HOSTNAME% %msgid% %msg%\n")

if ($programname == "iotmon") then {
    action(type="omfile" file="/var/log/iotmon/alerts.cef" template="IotmonFile")
    stop
}
