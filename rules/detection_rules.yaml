# Detection rules for the IoT Security Monitor.
#
# This file is the single source of truth for the rule catalogue: the rule
# IDs and names in alerts, the thresholds each detector uses, and which
# rules are enabled. The Python code in src/iotmon/detections.py implements
# the logic; everything you would tune lives here.
#
#   id          stable rule ID used in alerts, the dashboard and exports
#   detector    the detector class that implements it (detections.py)
#   severities  the severities this rule can raise (checked by the tests)
#   attack      MITRE ATT&CK (Enterprise / ICS) techniques the alerts map to
#               (checked by the tests against the alerts the engine produces)
#   settings    thresholds and windows, passed to the detector as-is
#
# No rule is "if port == X then hacker": each one counts something inside a
# time window and compares it with a threshold, and the core rules take that
# threshold from the device's own learned baseline. Full reasoning, false
# positives and blind spots: docs/detection-rules.md.
#
# Override any setting without editing this file: put it under
# `detections: <detector>: ...` in a site config passed with --config, or
# point --rules at a copy of this file.

rules:
  - id: DET-001
    detector: new_device
    name: New/unrecognized device
    description: >
      A MAC address that is not in the asset register. Without a register,
      a device first seen after the learning period.
    severities: [medium]
    attack: ["T1200 Hardware Additions", "T0848 Rogue Master (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Identify the device by MAC/vendor and locate it physically
      - Confirm whether it is an authorised addition
      - Approve it in the asset register, or remove it from the network
    enabled: true
    settings:
      learning_period_s: 60   # without an asset register: devices seen in the first minute form the baseline
      known_devices: []       # MACs or IPs that never alert, e.g. ["b8:27:eb:12:34:56"]
                              # (with --inventory, the asset register is the main allowlist)

  - id: DET-002
    detector: port_scan
    name: Port scanning behaviour
    description: >
      One source touching many ports on one host (vertical), one port on
      many hosts (horizontal), or ARP-resolving many addresses, in one window.
    severities: [medium, high]
    attack: ["T1046 Network Service Discovery", "T1018 Remote System Discovery",
             "T0846 Remote System Discovery (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Identify the scanning host and isolate it if unapproved
      - Review which hosts and ports it probed
      - Check the targets for signs of follow-up compromise
    enabled: true
    settings:
      window_s: 60
      vertical_threshold: 15    # distinct ports on one host
      horizontal_threshold: 8   # same port on distinct hosts
      arp_threshold: 12         # distinct ARP targets
      cooldown_s: 300

  - id: DET-003
    detector: connection_rate
    name: Abnormal connection rate
    description: >
      New connections from a device in one window above max(min_connections,
      peak_factor x its busiest baseline window).
    severities: [medium]
    attack: ["T1499 Endpoint Denial of Service", "T0814 Denial of Service (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Identify the source device and its normal connection rate
      - Determine whether the burst is a fault, a scan or a flood
      - Rate-limit or isolate the source if malicious
    enabled: true
    settings:
      window_s: 60
      min_connections: 20       # never alert below this many new connections per window
      peak_factor: 5.0          # ... or below 5x the device's busiest baseline window
      scan_suppress_s: 300      # a source flagged by port_scan is not re-flagged here
      cooldown_s: 300

  - id: DET-004
    detector: suspicious_port
    name: Communication with unusual ports
    description: >
      An established session on a port outside the device's baseline, or on
      a high-risk service (Telnet, IRC, ADB, ...) whatever the baseline;
      plaintext MQTT to the internet.
    severities: [medium, high, critical]
    attack: ["T1021 Remote Services", "T0886 Remote Services (ICS)", "T1071 Application Layer Protocol"]
    response:            # recommended analyst actions (Week 8)
      - Identify the service and whether it should be exposed
      - For Telnet/IRC/ADB, treat the device as potentially compromised
      - Disable the service or isolate the device
    enabled: true
    settings:
      cooldown_s: 600
      unusual_severity: medium  # established session on a port outside the device's baseline
      ports:                    # port -> severity, alerted whenever a session is established
        21: medium              # FTP, cleartext credentials
        23: high                # Telnet, Mirai's favourite
        69: medium              # TFTP, firmware pulls
        445: medium             # SMB
        2323: high              # Telnet alternate (Mirai)
        3389: medium            # RDP
        4444: critical          # Metasploit default handler
        5555: high              # Android Debug Bridge
        6667: critical          # IRC, classic botnet C2
        7547: medium            # TR-069 CWMP

  - id: DET-005
    detector: external_connection
    name: Unexpected external connection
    description: >
      An internet host that is not among the device's learned peers. High if
      the device is local-only, the address was never resolved by DNS, or
      the device fans out to many new hosts.
    severities: [medium, high]
    attack: ["T1071 Application Layer Protocol", "T0869 Standard Application Layer Protocol (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Resolve the destination and check its reputation
      - Confirm whether the device is expected to reach the internet
      - Block the destination and investigate the device if unexpected
    enabled: true
    settings:
      dns_window_s: 600         # an address the device resolved this recently counts as looked up
      fanout_window_s: 300
      fanout_threshold: 10      # distinct unexpected internet hosts -> one high fan-out alert
      host_alerts: 3            # per-host alerts per device and window before that
      cooldown_s: 600

  - id: DET-006
    detector: traffic_spike
    name: Traffic volume spike
    description: >
      Bytes or packets a device sends or receives per bucket above
      max(mean + stddev_factor x sigma, min_ratio x mean, absolute floor) of
      its own recent history.
    severities: [high]
    attack: ["T1498 Network Denial of Service", "T0814 Denial of Service (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Identify the device and the direction of the spike
      - Distinguish a legitimate transfer from exfiltration or a flood
      - Capture related traffic and isolate the device if malicious
    enabled: true
    settings:
      bucket_s: 10
      history_buckets: 30
      min_history: 6
      stddev_factor: 4.0
      min_ratio: 5.0            # also at least 5x the mean
      min_bytes: 50000          # ignore spikes below these absolute floors
      min_packets: 500
      cooldown_s: 300

  - id: DET-007
    detector: failed_connections
    name: Repeated failed connections
    description: >
      Refused or unanswered connections to one service, or refused MQTT
      logins, in one window.
    severities: [medium, high]
    attack: ["T1110 Brute Force", "T0812 Default Credentials (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Identify the source and the service being targeted
      - Confirm brute force versus a misconfigured client
      - Lock the account/service and block the source if hostile
    enabled: true
    settings:
      window_s: 60
      threshold: 10             # failures to the same service
      mqtt_auth_threshold: 5    # refused MQTT CONNECTs
      syn_timeout_s: 5

  - id: DET-008
    detector: device_change
    name: Device address change
    description: >
      An IP address claimed by a second MAC (what ARP spoofing looks like),
      or a known MAC on a new IP.
    severities: [low, high]
    attack: ["T1557.002 ARP Cache Poisoning", "T0830 Adversary-in-the-Middle (ICS)", "T1036 Masquerading"]
    response:            # recommended analyst actions (Week 8)
      - Compare the MAC/IP binding with the asset register
      - Rule out DHCP churn versus ARP spoofing
      - Quarantine the spoofing host and clear ARP caches
    enabled: true
    settings:
      ip_change_severity: low   # known MAC on a new IP (DHCP churn is the usual cause)
      learning_period_s: 0      # IP conflicts (two MACs, one IP) are always high
      cooldown_s: 300

  - id: DET-009
    detector: mqtt_activity
    name: Abnormal MQTT activity
    description: >
      A new host or client ID on the broker, a publish burst above
      max(min_messages, peak_factor x learned peak), a topic the client never
      used, another device's topic (spoofed telemetry), or a subscription to
      every topic.
    severities: [info, low, medium, high]
    attack: ["T0886 Remote Services (ICS)", "T0883 Internet Accessible Device (ICS)",
             "T0806 Brute Force I/O (ICS)", "T0814 Denial of Service (ICS)",
             "T0856 Spoof Reporting Message (ICS)", "T0855 Unauthorized Command Message (ICS)",
             "T0801 Monitor Process State (ICS)", "T0861 Point & Tag Identification (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Identify the MQTT client, its host and the broker
      - Check the topic ownership and message rate against the baseline
      - Revoke the client's credentials and enforce topic ACLs if abused
    enabled: true
    settings:
      window_s: 60
      min_messages: 30          # never a burst below this many publishes per window
      peak_factor: 5.0          # ... or below 5x the client's busiest baseline window
      topic_alerts: 3           # new-topic alerts per client per cooldown, so one rogue client cannot flood the queue
      cooldown_s: 600

  # --- OT / ICS rules (Week 7) ------------------------------------------- #
  # These stay silent unless an `ot:` section is configured (zones + policy).

  - id: DET-010
    detector: ot_new_asset
    name: New OT asset detected
    description: >
      A device appears in the OT zone, or a host starts answering Modbus/TCP
      (a PLC). High when the asset is not declared in the OT policy.
    severities: [medium, high]
    attack: ["T1200 Hardware Additions", "T0848 Rogue Master (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Identify the new OT asset and its role
      - Verify it against the control-network asset documentation
      - Declare it in the policy, or remove it from the OT zone
    enabled: true
    settings:
      cooldown_s: 3600

  - id: DET-011
    detector: unauthorized_modbus
    name: Unauthorized Modbus client
    description: >
      A Modbus client the policy does not allow to talk to a PLC. Reading is
      high; writing (changing the process) is critical. An allowed reader
      that writes, without being on the writers list, is high.
    severities: [high, critical]
    attack: ["T1021 Remote Services", "T0855 Unauthorized Command Message (ICS)",
             "T0836 Modify Parameter (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Identify the source and whether it is an authorised engineering station
      - For a write, assess the impact on the physical process immediately
      - Block the client at the switch and verify the PLC's register values
    enabled: true
    settings:
      cooldown_s: 600

  - id: DET-012
    detector: ot_segmentation
    name: IT host communicating with OT device
    description: >
      A host outside the OT zone opens a connection to an OT device that the
      policy does not permit (IT/IoT -> OT). External sources are critical,
      internal ones high.
    severities: [high, critical]
    attack: ["T1021 Remote Services", "T0886 Remote Services (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Identify the source host and its zone
      - Confirm whether the IT->OT path is sanctioned
      - Enforce segmentation (firewall/VLAN) and investigate the source
    enabled: true
    settings:
      cooldown_s: 600

  - id: DET-013
    detector: ot_protocol
    name: Unexpected protocol in OT network
    description: >
      An application protocol inside the OT zone that is not on the expected
      list (e.g. Telnet, HTTP or MQTT reaching a PLC). Remote-access protocols
      are high, anything else medium.
    severities: [medium, high]
    attack: ["T0869 Standard Application Layer Protocol (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Identify the unexpected protocol and the OT device involved
      - Determine whether it is management traffic or an intrusion
      - Disable the service on the OT device and restrict the path
    enabled: true
    settings:
      cooldown_s: 600

  - id: DET-014
    detector: modbus_rate
    name: Abnormal Modbus request rate
    description: >
      A Modbus client sending far more requests than during the baseline
      (a polling flood, or an enumeration of registers): requests per window
      >= max(min_requests, peak_factor x learned peak).
    severities: [medium]
    attack: ["T0801 Monitor Process State (ICS)", "T0814 Denial of Service (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Identify the Modbus client and its baseline request rate
      - Distinguish a polling misconfiguration from a flood or register scan
      - Rate-limit the client and verify PLC availability
    enabled: true
    settings:
      window_s: 60
      min_requests: 120         # never alert below this many requests per window
      peak_factor: 5.0          # ... or below 5x the client's busiest baseline window
      cooldown_s: 300

  - id: DET-015
    detector: ot_external
    name: OT device communicating externally
    description: >
      An OT-zone device opens a connection to the internet. A PLC reaching
      the internet is critical; any other OT device is high.
    severities: [high, critical]
    attack: ["T1071 Application Layer Protocol", "T0883 Internet Accessible Device (ICS)"]
    response:            # recommended analyst actions (Week 8)
      - Treat an OT device reaching the internet as a serious incident
      - Capture the traffic and identify the external destination
      - Isolate the OT device and begin incident response
    enabled: true
    settings:
      cooldown_s: 600
