name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke test the CLI on the sample capture
        run: |
          iotmon read samples/iot-lab.pcap -q --db /tmp/iotmon.db
          iotmon status --db /tmp/iotmon.db
          iotmon rules
          iotmon read samples/ot-lab.pcap -q --db /tmp/ot.db
          iotmon modbus --db /tmp/ot.db
          iotmon alert 1 --db /tmp/ot.db
          iotmon summary --db /tmp/ot.db
          iotmon pcap 1 --db /tmp/ot.db -o /tmp/alert.pcap
