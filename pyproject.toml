[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iotmon"
version = "0.1.0"
description = "Passive network monitoring and detection for IoT/OT networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kgiannopoulou" }]
dependencies = ["scapy>=2.6,<3", "flask>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
iotmon = "iotmon.cli:main"

[tool.setuptools.packages.find]
include = ["iotmon*"]

[tool.setuptools.package-data]
iotmon = ["default.toml", "dashboard/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
